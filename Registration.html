<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新莊國小 學習扶助報名</title>
<script src="https://cdn.tailwindcss.com"></script>

<script type="module">
    import { initializeApp }
        from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, doc, addDoc, collection, onSnapshot }
        from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // 與編班系統 / 管理後台共用同一個 Firebase 專案
    const firebaseConfig = {
        apiKey:            "AIzaSyDqOkKvL3k-snAYDs17fLsc1I156_xS-QI",
        authDomain:        "sjps-learningassistance.firebaseapp.com",
        projectId:         "sjps-learningassistance",
        storageBucket:     "sjps-learningassistance.firebasestorage.app",
        messagingSenderId: "108951710153",
        appId:             "1:108951710153:web:434de73a24160fe3e2e018",
        measurementId:     "G-EGQ7BLK57Y"
    };

    const app = initializeApp(firebaseConfig);
    const db  = getFirestore(app);

    const SETTINGS_REF = doc(db, "registrations_settings", "current");
    const REG_COL       = collection(db, "registrations");

    // 讀取目前開放的報名期別
    onSnapshot(SETTINGS_REF, (snap) => {
        const period = snap.exists() ? (snap.data().period || '') : '';
        const classTime = snap.exists() ? (snap.data().classTime || '') : '';
        window._onPeriodUpdate && window._onPeriodUpdate(period, classTime);
    }, (err) => console.error('讀取期別設定失敗', err));

    // 送出報名
    window._fbSubmitRegistration = async (data) => {
        try {
            await addDoc(REG_COL, { ...data, createdAt: Date.now() });
            return { ok: true };
        } catch (e) {
            console.error('報名送出失敗', e);
            return { ok: false, message: e.message || '未知錯誤' };
        }
    };
</script>

<style>
    body { font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif; }
    .subject-chip {
        border: 2px solid #e5e7eb; border-radius: 12px; padding: 14px 10px;
        text-align: center; cursor: pointer; user-select: none; transition: all .15s;
        font-weight: 700; font-size: 15px; color: #4b5563;
    }
    .subject-chip.active-國語 { border-color: #ef4444; background: #fef2f2; color: #b91c1c; }
    .subject-chip.active-數學 { border-color: #3b82f6; background: #eff6ff; color: #1d4ed8; }
    .subject-chip.active-英語 { border-color: #22c55e; background: #f0fdf4; color: #15803d; }
    .field-error { border-color: #ef4444 !important; }
</style>
</head>
<body class="bg-gray-50 min-h-screen">

<div class="max-w-lg mx-auto px-4 py-8">
    <div class="text-center mb-6">
        <h1 class="text-2xl font-black text-gray-800">新莊國小 學習扶助報名</h1>
        <p id="period-badge" class="mt-2 inline-block text-sm font-bold text-amber-700 bg-amber-100 px-3 py-1 rounded-full">
            載入期別中…
        </p>
        <p id="classtime-text" class="hidden mt-2 text-sm text-gray-500 font-bold"></p>
    </div>

    <div id="closed-notice" class="hidden bg-red-50 border border-red-200 text-red-700 text-sm rounded-xl p-4 mb-6 font-bold text-center">
        目前尚未開放報名，請洽詢學校公告。
    </div>

    <form id="reg-form" class="bg-white rounded-2xl shadow p-6 space-y-5">
        <div class="grid grid-cols-3 gap-3">
            <div>
                <label class="block text-xs font-bold text-gray-500 mb-1">年級</label>
                <input id="f-grade" type="number" min="1" max="6" inputmode="numeric"
                       class="w-full border rounded-lg px-3 py-2 text-center font-bold" placeholder="例如 3">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-500 mb-1">班級</label>
                <input id="f-class" type="number" min="1" inputmode="numeric"
                       class="w-full border rounded-lg px-3 py-2 text-center font-bold" placeholder="例如 5">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-500 mb-1">座號</label>
                <input id="f-seat" type="number" min="1" inputmode="numeric"
                       class="w-full border rounded-lg px-3 py-2 text-center font-bold" placeholder="例如 12">
            </div>
        </div>

        <div>
            <label class="block text-xs font-bold text-gray-500 mb-1">學生姓名</label>
            <input id="f-name" type="text" class="w-full border rounded-lg px-3 py-2 font-bold" placeholder="王小明">
        </div>

        <div>
            <label class="block text-xs font-bold text-gray-500 mb-2">報名科目（可複選）</label>
            <div class="grid grid-cols-3 gap-2" id="subject-chips">
                <div class="subject-chip" data-subject="國語">國語</div>
                <div class="subject-chip" data-subject="數學">數學</div>
                <div class="subject-chip" data-subject="英語">英語</div>
            </div>
        </div>

        <div class="border-t pt-4">
            <label class="block text-xs font-bold text-gray-500 mb-1">聯絡電話（三項至少填一項）</label>
            <div class="space-y-2">
                <input id="f-phone1" type="tel" class="w-full border rounded-lg px-3 py-2" placeholder="父親電話">
                <input id="f-phone2" type="tel" class="w-full border rounded-lg px-3 py-2" placeholder="母親電話">
                <input id="f-phone3" type="tel" class="w-full border rounded-lg px-3 py-2" placeholder="其他電話">
            </div>
        </div>

        <p id="form-error" class="hidden text-sm font-bold text-red-600 bg-red-50 rounded-lg px-3 py-2"></p>

        <button id="submit-btn" type="button"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition">
            送出報名
        </button>
    </form>

    <div id="success-view" class="hidden bg-white rounded-2xl shadow p-8 text-center">
        <div class="text-5xl mb-3">✅</div>
        <p class="font-black text-lg text-gray-800 mb-1">報名完成！</p>
        <p class="text-sm text-gray-500 mb-1" id="success-summary"></p>
        <p class="text-xs text-gray-400 mb-5 leading-relaxed">
            資料已送出，請等待學校統一分班後發放「開課通知單」。<br>
            通知單會由學校統一發放，若逾期未收到請與學校聯繫。
        </p>
        <button onclick="resetForm()" class="text-sm text-blue-600 font-bold">再填一筆</button>
    </div>
</div>

<script>
let currentPeriod = '';
window._onPeriodUpdate = (period, classTime) => {
    currentPeriod = period;
    const badge = document.getElementById('period-badge');
    const closedNotice = document.getElementById('closed-notice');
    const form = document.getElementById('reg-form');
    const classTimeEl = document.getElementById('classtime-text');
    if (classTime) {
        classTimeEl.textContent = '上課時間：' + classTime;
        classTimeEl.classList.remove('hidden');
    } else {
        classTimeEl.classList.add('hidden');
    }
    if (period) {
        badge.textContent = '報名期別：' + period;
        closedNotice.classList.add('hidden');
        form.classList.remove('hidden');
    } else {
        badge.textContent = '尚未開放報名';
        closedNotice.classList.remove('hidden');
        form.classList.add('hidden');
    }
};

const selectedSubjects = new Set();
document.querySelectorAll('.subject-chip').forEach(chip => {
    chip.addEventListener('click', () => {
        const s = chip.dataset.subject;
        if (selectedSubjects.has(s)) { selectedSubjects.delete(s); chip.classList.remove('active-' + s); }
        else { selectedSubjects.add(s); chip.classList.add('active-' + s); }
    });
});

function clearFieldErrors() {
    document.querySelectorAll('.field-error').forEach(el => el.classList.remove('field-error'));
    document.getElementById('form-error').classList.add('hidden');
}
function showFormError(msg, ...fieldIds) {
    document.getElementById('form-error').textContent = msg;
    document.getElementById('form-error').classList.remove('hidden');
    fieldIds.forEach(id => document.getElementById(id)?.classList.add('field-error'));
}

document.getElementById('submit-btn').addEventListener('click', async () => {
    clearFieldErrors();
    const grade = document.getElementById('f-grade').value.trim();
    const cls   = document.getElementById('f-class').value.trim();
    const seat  = document.getElementById('f-seat').value.trim();
    const name  = document.getElementById('f-name').value.trim();
    const p1 = document.getElementById('f-phone1').value.trim();
    const p2 = document.getElementById('f-phone2').value.trim();
    const p3 = document.getElementById('f-phone3').value.trim();

    if (!grade)      return showFormError('請填寫年級', 'f-grade');
    if (!cls)        return showFormError('請填寫班級', 'f-class');
    if (!seat)        return showFormError('請填寫座號', 'f-seat');
    if (!name)       return showFormError('請填寫學生姓名', 'f-name');
    if (selectedSubjects.size === 0) return showFormError('請至少選擇一項報名科目');
    if (!p1 && !p2 && !p3) return showFormError('父親電話、母親電話、其他電話請至少填寫一項', 'f-phone1', 'f-phone2', 'f-phone3');

    const btn = document.getElementById('submit-btn');
    btn.disabled = true; btn.textContent = '送出中…';

    const data = {
        period: currentPeriod,
        grade: Number(grade), class: Number(cls), seat: Number(seat),
        name, subjects: Array.from(selectedSubjects),
        phone1: p1, phone2: p2, phone3: p3
    };
    const res = await window._fbSubmitRegistration(data);
    btn.disabled = false; btn.textContent = '送出報名';

    if (res.ok) {
        document.getElementById('reg-form').classList.add('hidden');
        document.getElementById('success-view').classList.remove('hidden');
        document.getElementById('success-summary').textContent =
            `${grade}年${cls}班 ${seat}號 ${name}（${data.subjects.join('、')}）`;
    } else {
        showFormError('送出失敗：' + res.message);
    }
});

function resetForm() {
    document.getElementById('reg-form').reset();
    document.getElementById('reg-form').classList.remove('hidden');
    document.getElementById('success-view').classList.add('hidden');
    selectedSubjects.clear();
    document.querySelectorAll('.subject-chip').forEach(c => c.className = 'subject-chip');
    clearFieldErrors();
}
</script>
</body>
</html>
