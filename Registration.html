<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新莊國小 學習扶助報名</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script type="module">
    import { initializeApp }
        from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut }
        from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, addDoc, deleteDoc,
              collection, onSnapshot, query, where, getDocs }
        from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // 與編班系統相同的 Firebase 專案
    const firebaseConfig = {
        apiKey:            "AIzaSyDqOkKvL3k-snAYDs17fLsc1I156_xS-QI",
        authDomain:        "sjps-learningassistance.firebaseapp.com",
        projectId:         "sjps-learningassistance",
        storageBucket:     "sjps-learningassistance.firebasestorage.app",
        messagingSenderId: "108951710153",
        appId:             "1:108951710153:web:434de73a24160fe3e2e018",
        measurementId:     "G-EGQ7BLK57Y"
    };

    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);

    // ── 新增的 collection，不動到編班系統原本用的 shared / exam_list / users ──
    const SETTINGS_REF = doc(db, "registrations_settings", "current");
    const REG_COL       = collection(db, "registrations");

    window._firebaseAuth = auth;

    // 讀取目前開放的報名期別
    onSnapshot(SETTINGS_REF, (snap) => {
        const period = snap.exists() ? (snap.data().period || '') : '';
        window._onPeriodUpdate && window._onPeriodUpdate(period);
    }, (err) => {
        console.error('讀取期別設定失敗', err);
    });

    // 家長送出報名
    window._fbSubmitRegistration = async (data) => {
        try {
            await addDoc(REG_COL, { ...data, createdAt: Date.now() });
            return { ok: true };
        } catch (e) {
            console.error('報名送出失敗', e);
            return { ok: false, message: e.message || '未知錯誤' };
        }
    };

    // 管理員：更新期別
    window._fbSetPeriod = async (period) => {
        try { await setDoc(SETTINGS_REF, { period }); return true; }
        catch (e) { console.error('期別更新失敗', e); return false; }
    };

    // 管理員：即時監聽全部報名資料
    window._fbWatchRegistrations = (cb) => {
        return onSnapshot(REG_COL, (snap) => {
            const list = [];
            snap.forEach(d => list.push({ id: d.id, ...d.data() }));
            cb(list);
        }, (err) => {
            console.error('讀取報名清單失敗（可能是權限問題）', err);
            window._onRegError && window._onRegError();
        });
    };

    // 管理員：刪除單筆
    window._fbDeleteRegistration = async (id) => {
        try { await deleteDoc(doc(db, 'registrations', id)); return true; }
        catch (e) { console.error('刪除失敗', e); return false; }
    };

    // 管理員：清空指定期別（或全部）的報名資料
    window._fbClearRegistrations = async (period) => {
        try {
            const q = period ? query(REG_COL, where('period', '==', period)) : REG_COL;
            const snap = await getDocs(q);
            const jobs = [];
            snap.forEach(d => jobs.push(deleteDoc(doc(db, 'registrations', d.id))));
            await Promise.all(jobs);
            return { ok: true, count: jobs.length };
        } catch (e) {
            console.error('清空失敗', e);
            return { ok: false, message: e.message };
        }
    };

    // 管理員登入（沿用編班系統同一批管理員信箱）
    const ADMIN_EMAILS = ['issac@sjps.kh.edu.tw'];
    const googleProvider = new GoogleAuthProvider();

    window._fbAdminLogin = async () => {
        try {
            const result = await signInWithPopup(auth, googleProvider);
            const email  = result.user.email || '';
            const uid    = result.user.uid;
            if (ADMIN_EMAILS.includes(email)) return { ok: true, email };
            try {
                const userSnap = await getDoc(doc(db, 'users', uid));
                if (userSnap.exists() && userSnap.data().role === 'admin') return { ok: true, email };
            } catch (inner) { console.error(inner); }
            await signOut(auth);
            return { ok: false, message: `此 Google 帳號（${email}）沒有管理員權限` };
        } catch (e) {
            console.error(e);
            return { ok: false, message: '登入失敗或已取消：' + (e.message || '未知錯誤') };
        }
    };

    window._fbAdminLogout = async () => { try { await signOut(auth); } catch (e) { console.error(e); } };
</script>

<style>
    body { font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif; }
    .subject-chip {
        border: 2px solid #e5e7eb; border-radius: 12px; padding: 14px 10px;
        text-align: center; cursor: pointer; user-select: none; transition: all .15s;
        font-weight: 700; font-size: 15px; color: #4b5563;
    }
    .subject-chip.active-國語 { border-color: #ef4444; background: #fef2f2; color: #b91c1c; }
    .subject-chip.active-數學 { border-color: #3b82f6; background: #eff6ff; color: #1d4ed8; }
    .subject-chip.active-英語 { border-color: #22c55e; background: #f0fdf4; color: #15803d; }
    input[type=number]::-webkit-inner-spin-button { opacity: 1; }
    .field-error { border-color: #ef4444 !important; }
</style>
</head>
<body class="bg-gray-50 min-h-screen">

<!-- ============ 家長報名頁 ============ -->
<div id="parent-view" class="max-w-lg mx-auto px-4 py-8">
    <div class="text-center mb-6">
        <h1 class="text-2xl font-black text-gray-800">新莊國小 學習扶助報名</h1>
        <p id="period-badge" class="mt-2 inline-block text-sm font-bold text-amber-700 bg-amber-100 px-3 py-1 rounded-full">
            載入期別中…
        </p>
    </div>

    <div id="closed-notice" class="hidden bg-red-50 border border-red-200 text-red-700 text-sm rounded-xl p-4 mb-6 font-bold text-center">
        目前尚未開放報名，請洽詢學校公告。
    </div>

    <form id="reg-form" class="bg-white rounded-2xl shadow p-6 space-y-5">
        <div class="grid grid-cols-3 gap-3">
            <div>
                <label class="block text-xs font-bold text-gray-500 mb-1">年級</label>
                <input id="f-grade" type="number" min="1" max="6" inputmode="numeric"
                       class="w-full border rounded-lg px-3 py-2 text-center font-bold" placeholder="例如 3">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-500 mb-1">班級</label>
                <input id="f-class" type="number" min="1" inputmode="numeric"
                       class="w-full border rounded-lg px-3 py-2 text-center font-bold" placeholder="例如 5">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-500 mb-1">座號</label>
                <input id="f-seat" type="number" min="1" inputmode="numeric"
                       class="w-full border rounded-lg px-3 py-2 text-center font-bold" placeholder="例如 12">
            </div>
        </div>

        <div>
            <label class="block text-xs font-bold text-gray-500 mb-1">學生姓名</label>
            <input id="f-name" type="text" class="w-full border rounded-lg px-3 py-2 font-bold" placeholder="王小明">
        </div>

        <div>
            <label class="block text-xs font-bold text-gray-500 mb-2">報名科目（可複選）</label>
            <div class="grid grid-cols-3 gap-2" id="subject-chips">
                <div class="subject-chip" data-subject="國語">國語</div>
                <div class="subject-chip" data-subject="數學">數學</div>
                <div class="subject-chip" data-subject="英語">英語</div>
            </div>
        </div>

        <div class="border-t pt-4">
            <label class="block text-xs font-bold text-gray-500 mb-1">聯絡電話（三項至少填一項）</label>
            <div class="space-y-2">
                <input id="f-phone1" type="tel" class="w-full border rounded-lg px-3 py-2" placeholder="父親電話">
                <input id="f-phone2" type="tel" class="w-full border rounded-lg px-3 py-2" placeholder="母親電話">
                <input id="f-phone3" type="tel" class="w-full border rounded-lg px-3 py-2" placeholder="其他電話">
            </div>
        </div>

        <p id="form-error" class="hidden text-sm font-bold text-red-600 bg-red-50 rounded-lg px-3 py-2"></p>

        <button id="submit-btn" type="button"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition">
            送出報名
        </button>
    </form>

    <div id="success-view" class="hidden bg-white rounded-2xl shadow p-8 text-center">
        <div class="text-5xl mb-3">✅</div>
        <p class="font-black text-lg text-gray-800 mb-1">報名完成！</p>
        <p class="text-sm text-gray-500 mb-5" id="success-summary"></p>
        <button onclick="resetForm()" class="text-sm text-blue-600 font-bold">再填一筆</button>
    </div>

    <div class="text-center mt-6">
        <a href="#admin" onclick="showAdmin()" class="text-xs text-gray-300 hover:text-gray-400">管理</a>
    </div>
</div>

<!-- ============ 管理員頁 ============ -->
<div id="admin-view" class="hidden max-w-5xl mx-auto px-4 py-8">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-xl font-black text-gray-800">報名資料管理</h1>
        <div class="flex items-center gap-3">
            <span id="admin-badge" class="text-xs font-bold px-2 py-1 rounded-full bg-gray-100 text-gray-500">未登入</span>
            <button id="admin-login-btn" onclick="doAdminLogin()" class="text-sm bg-gray-800 text-white px-3 py-1.5 rounded-lg">管理員登入</button>
            <button id="admin-logout-btn" onclick="doAdminLogout()" class="hidden text-sm bg-gray-200 px-3 py-1.5 rounded-lg">登出</button>
            <a href="#" onclick="showParent()" class="text-sm text-blue-600 font-bold">回報名頁</a>
        </div>
    </div>

    <div id="admin-locked" class="bg-white rounded-2xl shadow p-10 text-center text-gray-400">
        請先登入管理員帳號才能查看報名資料。
    </div>

    <div id="admin-panel" class="hidden space-y-6">
        <div class="bg-white rounded-2xl shadow p-5">
            <label class="block text-xs font-bold text-gray-500 mb-2">目前開放報名期別（家長端會看到這個名稱）</label>
            <div class="flex gap-2">
                <input id="period-input" type="text" class="flex-1 border rounded-lg px-3 py-2" placeholder="例如：114學年度第1期">
                <button onclick="savePeriod()" class="bg-blue-600 text-white font-bold px-4 rounded-lg">儲存</button>
            </div>
            <p class="text-xs text-gray-400 mt-2">留空＝暫停開放報名，家長端會顯示「尚未開放報名」。</p>
        </div>

        <div class="bg-white rounded-2xl shadow p-5">
            <div class="flex flex-wrap justify-between items-center gap-3 mb-4">
                <div class="flex items-center gap-2">
                    <span class="font-bold text-gray-700">報名清單</span>
                    <span id="reg-count" class="text-xs bg-gray-100 px-2 py-1 rounded-full font-bold text-gray-500">0 筆</span>
                </div>
                <div class="flex gap-2">
                    <select id="filter-period" onchange="renderTable()" class="border rounded-lg px-2 py-1.5 text-sm"></select>
                    <button onclick="exportExcel()" class="text-sm bg-green-600 text-white px-3 py-1.5 rounded-lg font-bold">匯出 Excel</button>
                    <button onclick="clearThisPeriod()" class="text-sm bg-red-500 text-white px-3 py-1.5 rounded-lg font-bold">清空此期別資料</button>
                </div>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead>
                        <tr class="bg-gray-50 text-gray-500 text-xs">
                            <th class="px-2 py-2 text-left">期別</th>
                            <th class="px-2 py-2">年級</th>
                            <th class="px-2 py-2">班級</th>
                            <th class="px-2 py-2">座號</th>
                            <th class="px-2 py-2 text-left">姓名</th>
                            <th class="px-2 py-2 text-left">報名科目</th>
                            <th class="px-2 py-2 text-left">父親電話</th>
                            <th class="px-2 py-2 text-left">母親電話</th>
                            <th class="px-2 py-2 text-left">其他電話</th>
                            <th class="px-2 py-2"></th>
                        </tr>
                    </thead>
                    <tbody id="reg-tbody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
// ── 家長端：期別即時更新 ─────────────────────────────
let currentPeriod = '';
window._onPeriodUpdate = (period) => {
    currentPeriod = period;
    const badge = document.getElementById('period-badge');
    const closedNotice = document.getElementById('closed-notice');
    const form = document.getElementById('reg-form');
    if (period) {
        badge.textContent = '報名期別：' + period;
        closedNotice.classList.add('hidden');
        form.classList.remove('hidden');
    } else {
        badge.textContent = '尚未開放報名';
        closedNotice.classList.remove('hidden');
        form.classList.add('hidden');
    }
    // 同步管理員頁的期別輸入框（若還沒手動輸入過）
    const pi = document.getElementById('period-input');
    if (pi && !pi.dataset.touched) pi.value = period;
};

// ── 科目多選 ─────────────────────────────
const selectedSubjects = new Set();
document.querySelectorAll('.subject-chip').forEach(chip => {
    chip.addEventListener('click', () => {
        const s = chip.dataset.subject;
        if (selectedSubjects.has(s)) { selectedSubjects.delete(s); chip.classList.remove('active-' + s); }
        else { selectedSubjects.add(s); chip.classList.add('active-' + s); }
    });
});

function clearFieldErrors() {
    document.querySelectorAll('.field-error').forEach(el => el.classList.remove('field-error'));
    document.getElementById('form-error').classList.add('hidden');
}
function showFormError(msg, ...fieldIds) {
    document.getElementById('form-error').textContent = msg;
    document.getElementById('form-error').classList.remove('hidden');
    fieldIds.forEach(id => document.getElementById(id)?.classList.add('field-error'));
}

document.getElementById('submit-btn').addEventListener('click', async () => {
    clearFieldErrors();
    const grade = document.getElementById('f-grade').value.trim();
    const cls   = document.getElementById('f-class').value.trim();
    const seat  = document.getElementById('f-seat').value.trim();
    const name  = document.getElementById('f-name').value.trim();
    const p1 = document.getElementById('f-phone1').value.trim();
    const p2 = document.getElementById('f-phone2').value.trim();
    const p3 = document.getElementById('f-phone3').value.trim();

    if (!grade)      return showFormError('請填寫年級', 'f-grade');
    if (!cls)        return showFormError('請填寫班級', 'f-class');
    if (!seat)        return showFormError('請填寫座號', 'f-seat');
    if (!name)       return showFormError('請填寫學生姓名', 'f-name');
    if (selectedSubjects.size === 0) return showFormError('請至少選擇一項報名科目');
    if (!p1 && !p2 && !p3) return showFormError('父親電話、母親電話、其他電話請至少填寫一項', 'f-phone1', 'f-phone2', 'f-phone3');

    const btn = document.getElementById('submit-btn');
    btn.disabled = true; btn.textContent = '送出中…';

    const data = {
        period: currentPeriod,
        grade: Number(grade), class: Number(cls), seat: Number(seat),
        name, subjects: Array.from(selectedSubjects),
        phone1: p1, phone2: p2, phone3: p3
    };
    const res = await window._fbSubmitRegistration(data);
    btn.disabled = false; btn.textContent = '送出報名';

    if (res.ok) {
        document.getElementById('reg-form').classList.add('hidden');
        document.getElementById('success-view').classList.remove('hidden');
        document.getElementById('success-summary').textContent =
            `${grade}年${cls}班 ${seat}號 ${name}（${data.subjects.join('、')}）`;
    } else {
        showFormError('送出失敗：' + res.message);
    }
});

function resetForm() {
    document.getElementById('reg-form').reset();
    document.getElementById('reg-form').classList.remove('hidden');
    document.getElementById('success-view').classList.add('hidden');
    selectedSubjects.clear();
    document.querySelectorAll('.subject-chip').forEach(c => c.className = 'subject-chip');
    clearFieldErrors();
}

// ── 頁面切換 ─────────────────────────────
function showAdmin()  { document.getElementById('parent-view').classList.add('hidden'); document.getElementById('admin-view').classList.remove('hidden'); }
function showParent() { document.getElementById('admin-view').classList.add('hidden'); document.getElementById('parent-view').classList.remove('hidden'); }
if (location.hash === '#admin') showAdmin();

// ── 管理員登入 ─────────────────────────────
let IS_ADMIN = false;
let allRegistrations = [];
let unsubReg = null;

async function doAdminLogin() {
    const res = await window._fbAdminLogin();
    if (res.ok) {
        IS_ADMIN = true;
        document.getElementById('admin-badge').textContent = '✏️ 管理員（' + res.email + '）';
        document.getElementById('admin-badge').className = 'text-xs font-bold px-2 py-1 rounded-full bg-green-100 text-green-700';
        document.getElementById('admin-login-btn').classList.add('hidden');
        document.getElementById('admin-logout-btn').classList.remove('hidden');
        document.getElementById('admin-locked').classList.add('hidden');
        document.getElementById('admin-panel').classList.remove('hidden');
        startWatchingRegistrations();
    } else {
        alert(res.message);
    }
}
async function doAdminLogout() {
    await window._fbAdminLogout();
    IS_ADMIN = false;
    if (unsubReg) unsubReg();
    document.getElementById('admin-badge').textContent = '未登入';
    document.getElementById('admin-badge').className = 'text-xs font-bold px-2 py-1 rounded-full bg-gray-100 text-gray-500';
    document.getElementById('admin-login-btn').classList.remove('hidden');
    document.getElementById('admin-logout-btn').classList.add('hidden');
    document.getElementById('admin-locked').classList.remove('hidden');
    document.getElementById('admin-panel').classList.add('hidden');
}

function startWatchingRegistrations() {
    unsubReg = window._fbWatchRegistrations((list) => {
        allRegistrations = list;
        updatePeriodFilterOptions();
        renderTable();
    });
}
window._onRegError = () => {
    alert('讀取報名清單失敗，可能是 Firestore 權限尚未開放 registrations 集合的讀取，請檢查 Firebase Rules。');
};

function updatePeriodFilterOptions() {
    const sel = document.getElementById('filter-period');
    const periods = Array.from(new Set(allRegistrations.map(r => r.period || '(無期別)'))).sort().reverse();
    const prevVal = sel.value;
    sel.innerHTML = '<option value="__all__">全部期別</option>' +
        periods.map(p => `<option value="${p}">${p}</option>`).join('');
    if (periods.includes(prevVal)) sel.value = prevVal;
    else sel.value = currentPeriod || '__all__';
}

function renderTable() {
    const filter = document.getElementById('filter-period').value;
    const rows = allRegistrations
        .filter(r => filter === '__all__' || (r.period || '(無期別)') === filter)
        .sort((a,b) => (a.grade-b.grade)||(a.class-b.class)||(a.seat-b.seat));

    document.getElementById('reg-count').textContent = rows.length + ' 筆';
    document.getElementById('reg-tbody').innerHTML = rows.map(r => `
        <tr class="border-b hover:bg-gray-50">
            <td class="px-2 py-2 text-xs text-gray-400">${r.period || '—'}</td>
            <td class="px-2 py-2 text-center">${r.grade}</td>
            <td class="px-2 py-2 text-center">${r.class}</td>
            <td class="px-2 py-2 text-center">${r.seat}</td>
            <td class="px-2 py-2 font-bold">${r.name}</td>
            <td class="px-2 py-2">${(r.subjects||[]).join('、')}</td>
            <td class="px-2 py-2 font-mono">${r.phone1||'—'}</td>
            <td class="px-2 py-2 font-mono">${r.phone2||'—'}</td>
            <td class="px-2 py-2 font-mono">${r.phone3||'—'}</td>
            <td class="px-2 py-2 text-right">
                <button onclick="deleteRow('${r.id}')" class="text-xs text-red-500 hover:underline">刪除</button>
            </td>
        </tr>`).join('') || `<tr><td colspan="10" class="text-center text-gray-400 py-8">目前沒有報名資料</td></tr>`;
}

async function deleteRow(id) {
    if (!confirm('確定要刪除這筆報名資料嗎？')) return;
    await window._fbDeleteRegistration(id);
}

async function savePeriod() {
    const input = document.getElementById('period-input');
    input.dataset.touched = '1';
    const val = input.value.trim();
    const ok = await window._fbSetPeriod(val);
    alert(ok ? '已更新期別設定' : '更新失敗，請確認管理員權限');
}

async function clearThisPeriod() {
    const filter = document.getElementById('filter-period').value;
    const targetPeriod = filter === '__all__' ? null : filter;
    const msg = targetPeriod
        ? `確定要清空期別「${targetPeriod}」的所有報名資料嗎？此動作無法復原。`
        : `確定要清空「全部」報名資料嗎？此動作無法復原。`;
    if (!confirm(msg)) return;
    const res = await window._fbClearRegistrations(targetPeriod);
    alert(res.ok ? `已清空 ${res.count} 筆資料` : '清空失敗：' + res.message);
}

function exportExcel() {
    const filter = document.getElementById('filter-period').value;
    const rows = allRegistrations
        .filter(r => filter === '__all__' || (r.period || '(無期別)') === filter)
        .sort((a,b) => (a.grade-b.grade)||(a.class-b.class)||(a.seat-b.seat))
        .map(r => ({
            期別: r.period || '', 年級: r.grade, 班級: r.class, 座號: r.seat, 姓名: r.name,
            報名科目: (r.subjects||[]).join('、'),
            父親電話: r.phone1 || '', 母親電話: r.phone2 || '', 其他電話: r.phone3 || ''
        }));
    if (!rows.length) return alert('目前沒有資料可以匯出');
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '報名名單');
    XLSX.writeFile(wb, `學習扶助報名名單_${filter === '__all__' ? '全部' : filter}.xlsx`);
}
</script>
</body>
</html>
