<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>學習扶助報名 — 管理後台</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script type="module">
    import { initializeApp }
        from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
        from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, deleteDoc,
              collection, onSnapshot, query, where, getDocs }
        from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // 與編班系統 / 家長報名頁共用同一個 Firebase 專案
    const firebaseConfig = {
        apiKey:            "AIzaSyDqOkKvL3k-snAYDs17fLsc1I156_xS-QI",
        authDomain:        "sjps-learningassistance.firebaseapp.com",
        projectId:         "sjps-learningassistance",
        storageBucket:     "sjps-learningassistance.firebasestorage.app",
        messagingSenderId: "108951710153",
        appId:             "1:108951710153:web:434de73a24160fe3e2e018",
        measurementId:     "G-EGQ7BLK57Y"
    };

    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);

    const SETTINGS_REF = doc(db, "registrations_settings", "current");
    const REG_COL       = collection(db, "registrations");

    // 管理員：更新期別
    window._fbSetPeriod = async (period) => {
        try { await setDoc(SETTINGS_REF, { period }, { merge: true }); return true; }
        catch (e) { console.error('期別更新失敗', e); return false; }
    };
    window._fbGetSettings = async () => {
        const snap = await getDoc(SETTINGS_REF);
        return snap.exists() ? { period: snap.data().period || '', classTime: snap.data().classTime || '' } : { period: '', classTime: '' };
    };
    window._fbSetClassTime = async (classTime) => {
        try { await setDoc(SETTINGS_REF, { classTime }, { merge: true }); return true; }
        catch (e) { console.error('上課時間更新失敗', e); return false; }
    };

    // 管理員：即時監聽全部報名資料
    window._fbWatchRegistrations = (cb) => {
        return onSnapshot(REG_COL, (snap) => {
            const list = [];
            snap.forEach(d => list.push({ id: d.id, ...d.data() }));
            cb(list);
        }, (err) => {
            console.error('讀取報名清單失敗（可能是權限問題）', err);
            window._onRegError && window._onRegError();
        });
    };

    window._fbDeleteRegistration = async (id) => {
        try { await deleteDoc(doc(db, 'registrations', id)); return true; }
        catch (e) { console.error('刪除失敗', e); return false; }
    };

    // 管理員：清空指定期別（或全部）的報名資料
    window._fbClearRegistrations = async (period) => {
        try {
            const q = period ? query(REG_COL, where('period', '==', period)) : REG_COL;
            const snap = await getDocs(q);
            const jobs = [];
            snap.forEach(d => jobs.push(deleteDoc(doc(db, 'registrations', d.id))));
            await Promise.all(jobs);
            return { ok: true, count: jobs.length };
        } catch (e) {
            console.error('清空失敗', e);
            return { ok: false, message: e.message };
        }
    };

    // 管理員登入（沿用編班系統同一批管理員信箱；與 admin.html 的 RBAC 名冊各自獨立判斷）
    const ADMIN_EMAILS = ['issac@sjps.kh.edu.tw'];
    const googleProvider = new GoogleAuthProvider();

    // 共用：判斷某個已登入的 user 是否為管理員
    async function checkAdmin(user) {
        const email = user.email || '';
        if (ADMIN_EMAILS.includes(email)) return { ok: true, email };
        try {
            const userSnap = await getDoc(doc(db, 'users', user.uid));
            if (userSnap.exists() && userSnap.data().role === 'admin') return { ok: true, email };
        } catch (inner) { console.error(inner); }
        return { ok: false, email };
    }

    // 頁面重新整理時，若瀏覽器仍記得登入狀態，自動嘗試恢復管理員畫面
    onAuthStateChanged(auth, async (user) => {
        if (user && window._onAuthRestore) {
            const res = await checkAdmin(user);
            window._onAuthRestore(res.ok ? res : null);
        } else if (!user && window._onAuthRestore) {
            window._onAuthRestore(null);
        }
    });

    window._fbAdminLogin = async () => {
        try {
            const result = await signInWithPopup(auth, googleProvider);
            const res = await checkAdmin(result.user);
            if (res.ok) return { ok: true, email: res.email };
            await signOut(auth);
            return { ok: false, message: `此 Google 帳號（${res.email}）沒有管理員權限` };
        } catch (e) {
            console.error(e);
            return { ok: false, message: '登入失敗或已取消：' + (e.message || '未知錯誤') };
        }
    };

    window._fbAdminLogout = async () => { try { await signOut(auth); } catch (e) { console.error(e); } };
</script>

<style>
    body { font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif; }
</style>
</head>
<body class="bg-gray-50 min-h-screen">

<div class="max-w-5xl mx-auto px-4 py-8">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-xl font-black text-gray-800">學習扶助報名 — 管理後台</h1>
        <div class="flex items-center gap-3">
            <span id="admin-badge" class="text-xs font-bold px-2 py-1 rounded-full bg-gray-100 text-gray-500">未登入</span>
            <button id="admin-login-btn" onclick="doAdminLogin()" class="text-sm bg-gray-800 text-white px-3 py-1.5 rounded-lg">管理員登入</button>
            <button id="admin-logout-btn" onclick="doAdminLogout()" class="hidden text-sm bg-gray-200 px-3 py-1.5 rounded-lg">登出</button>
            <a href="Registration.html" class="text-sm text-blue-600 font-bold">前往報名頁</a>
        </div>
    </div>

    <div id="admin-locked" class="bg-white rounded-2xl shadow p-10 text-center text-gray-400">
        請先登入管理員帳號才能查看報名資料。
    </div>

    <div id="admin-panel" class="hidden space-y-6">
        <div class="bg-white rounded-2xl shadow p-5">
            <label class="block text-xs font-bold text-gray-500 mb-2">目前開放報名期別（家長端會看到這個名稱）</label>
            <div class="flex gap-2">
                <input id="period-input" type="text" class="flex-1 border rounded-lg px-3 py-2" placeholder="例如：114學年度第1期">
                <button onclick="savePeriod()" class="bg-blue-600 text-white font-bold px-4 rounded-lg">儲存</button>
            </div>
            <p class="text-xs text-gray-400 mt-2">留空＝暫停開放報名，家長端會顯示「尚未開放報名」。</p>

            <label class="block text-xs font-bold text-gray-500 mb-2 mt-5">上課時間說明（顯示在報名頁，可隨時修改）</label>
            <div class="flex gap-2">
                <input id="classtime-input" type="text" class="flex-1 border rounded-lg px-3 py-2"
                       placeholder="例如：115.09.21(一)~116.01.14(四) 每週(一)(四)">
                <button onclick="saveClassTime()" class="bg-blue-600 text-white font-bold px-4 rounded-lg">儲存</button>
            </div>
            <p class="text-xs text-gray-400 mt-2">留空＝報名頁不顯示這行。</p>
        </div>

        <div class="bg-white rounded-2xl shadow p-5">
            <div class="flex flex-wrap justify-between items-center gap-3 mb-4">
                <div class="flex items-center gap-2">
                    <span class="font-bold text-gray-700">報名清單</span>
                    <span id="reg-count" class="text-xs bg-gray-100 px-2 py-1 rounded-full font-bold text-gray-500">0 筆</span>
                </div>
                <div class="flex gap-2">
                    <select id="filter-period" onchange="renderTable()" class="border rounded-lg px-2 py-1.5 text-sm"></select>
                    <select id="sort-mode" onchange="renderTable()" class="border rounded-lg px-2 py-1.5 text-sm">
                        <option value="time-asc">依報名時間（先→後）</option>
                        <option value="time-desc">依報名時間（後→先）</option>
                        <option value="seat">依年級/班級/座號</option>
                    </select>
                    <button onclick="exportExcel()" class="text-sm bg-green-600 text-white px-3 py-1.5 rounded-lg font-bold">匯出 Excel</button>
                    <button onclick="clearThisPeriod()" class="text-sm bg-red-500 text-white px-3 py-1.5 rounded-lg font-bold">清空此期別資料</button>
                </div>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead>
                        <tr class="bg-gray-50 text-gray-500 text-xs">
                            <th class="px-2 py-2 text-left cursor-pointer select-none" onclick="toggleTimeSort()">報名時間 ⇅</th>
                            <th class="px-2 py-2 text-left">期別</th>
                            <th class="px-2 py-2">年級</th>
                            <th class="px-2 py-2">班級</th>
                            <th class="px-2 py-2">座號</th>
                            <th class="px-2 py-2 text-left">姓名</th>
                            <th class="px-2 py-2 text-left">報名科目</th>
                            <th class="px-2 py-2 text-left">父親電話</th>
                            <th class="px-2 py-2 text-left">母親電話</th>
                            <th class="px-2 py-2 text-left">其他電話</th>
                            <th class="px-2 py-2"></th>
                        </tr>
                    </thead>
                    <tbody id="reg-tbody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
let IS_ADMIN = false;
let currentPeriod = '';
let allRegistrations = [];
let unsubReg = null;

function applyAdminUI(email) {
    IS_ADMIN = true;
    document.getElementById('admin-badge').textContent = '✏️ 管理員（' + email + '）';
    document.getElementById('admin-badge').className = 'text-xs font-bold px-2 py-1 rounded-full bg-green-100 text-green-700';
    document.getElementById('admin-login-btn').classList.add('hidden');
    document.getElementById('admin-logout-btn').classList.remove('hidden');
    document.getElementById('admin-locked').classList.add('hidden');
    document.getElementById('admin-panel').classList.remove('hidden');
}

// 重新整理頁面時，Firebase 記得的登入狀態會經由這裡自動恢復管理員畫面
window._onAuthRestore = async (res) => {
    if (res && res.ok) {
        applyAdminUI(res.email);
        const settings = await window._fbGetSettings();
        currentPeriod = settings.period;
        document.getElementById('period-input').value = settings.period;
        document.getElementById('classtime-input').value = settings.classTime;
        startWatchingRegistrations();
    }
};

async function doAdminLogin() {
    const res = await window._fbAdminLogin();
    if (res.ok) {
        applyAdminUI(res.email);
        const settings = await window._fbGetSettings();
        currentPeriod = settings.period;
        document.getElementById('period-input').value = settings.period;
        document.getElementById('classtime-input').value = settings.classTime;
        startWatchingRegistrations();
    } else {
        alert(res.message);
    }
}
async function doAdminLogout() {
    await window._fbAdminLogout();
    IS_ADMIN = false;
    if (unsubReg) unsubReg();
    document.getElementById('admin-badge').textContent = '未登入';
    document.getElementById('admin-badge').className = 'text-xs font-bold px-2 py-1 rounded-full bg-gray-100 text-gray-500';
    document.getElementById('admin-login-btn').classList.remove('hidden');
    document.getElementById('admin-logout-btn').classList.add('hidden');
    document.getElementById('admin-locked').classList.remove('hidden');
    document.getElementById('admin-panel').classList.add('hidden');
}

function startWatchingRegistrations() {
    unsubReg = window._fbWatchRegistrations((list) => {
        allRegistrations = list;
        updatePeriodFilterOptions();
        renderTable();
    });
}
window._onRegError = () => {
    alert('讀取報名清單失敗，可能是 Firestore 權限尚未開放 registrations 集合的讀取，請檢查 Firebase Rules。');
};

function updatePeriodFilterOptions() {
    const sel = document.getElementById('filter-period');
    const periods = Array.from(new Set(allRegistrations.map(r => r.period || '(無期別)'))).sort().reverse();
    const prevVal = sel.value;
    sel.innerHTML = '<option value="__all__">全部期別</option>' +
        periods.map(p => `<option value="${p}">${p}</option>`).join('');
    if (periods.includes(prevVal)) sel.value = prevVal;
    else sel.value = currentPeriod || '__all__';
}

function formatRegTime(r) {
    // 舊資料若沒有 createdAt，就用 Firestore 文件 id 當作沒有時間資訊處理
    if (!r.createdAt) return null;
    const d = new Date(r.createdAt);
    if (isNaN(d.getTime())) return null;
    return d;
}

function sortRows(rows, mode) {
    if (mode === 'time-asc' || mode === 'time-desc') {
        const dir = mode === 'time-asc' ? 1 : -1;
        return rows.sort((a, b) => {
            const ta = a.createdAt ?? Infinity; // 沒有時間資訊的排到最後
            const tb = b.createdAt ?? Infinity;
            if (ta === tb) return (a.grade-b.grade)||(a.class-b.class)||(a.seat-b.seat);
            return dir * (ta - tb);
        });
    }
    // 依年級/班級/座號
    return rows.sort((a,b) => (a.grade-b.grade)||(a.class-b.class)||(a.seat-b.seat));
}

function toggleTimeSort() {
    const sel = document.getElementById('sort-mode');
    sel.value = sel.value === 'time-asc' ? 'time-desc' : 'time-asc';
    renderTable();
}

function renderTable() {
    const filter = document.getElementById('filter-period').value;
    const mode = document.getElementById('sort-mode').value;
    const rows = sortRows(
        allRegistrations.filter(r => filter === '__all__' || (r.period || '(無期別)') === filter),
        mode
    );

    document.getElementById('reg-count').textContent = rows.length + ' 筆';
    document.getElementById('reg-tbody').innerHTML = rows.map((r, i) => {
        const d = formatRegTime(r);
        const timeLabel = d
            ? d.toLocaleString('zh-TW', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false })
            : '—';
        const order = (mode === 'time-asc') ? `<span class="text-xs text-gray-400 mr-1">#${i+1}</span>` : '';
        return `
        <tr class="border-b hover:bg-gray-50">
            <td class="px-2 py-2 text-xs text-gray-500 whitespace-nowrap">${order}${timeLabel}</td>
            <td class="px-2 py-2 text-xs text-gray-400">${r.period || '—'}</td>
            <td class="px-2 py-2 text-center">${r.grade}</td>
            <td class="px-2 py-2 text-center">${r.class}</td>
            <td class="px-2 py-2 text-center">${r.seat}</td>
            <td class="px-2 py-2 font-bold">${r.name}</td>
            <td class="px-2 py-2">${(r.subjects||[]).join('、')}</td>
            <td class="px-2 py-2 font-mono">${r.phone1||'—'}</td>
            <td class="px-2 py-2 font-mono">${r.phone2||'—'}</td>
            <td class="px-2 py-2 font-mono">${r.phone3||'—'}</td>
            <td class="px-2 py-2 text-right">
                <button onclick="deleteRow('${r.id}')" class="text-xs text-red-500 hover:underline">刪除</button>
            </td>
        </tr>`;
    }).join('') || `<tr><td colspan="11" class="text-center text-gray-400 py-8">目前沒有報名資料</td></tr>`;
}

async function deleteRow(id) {
    if (!confirm('確定要刪除這筆報名資料嗎？')) return;
    await window._fbDeleteRegistration(id);
}

async function savePeriod() {
    const input = document.getElementById('period-input');
    const val = input.value.trim();
    const ok = await window._fbSetPeriod(val);
    if (ok) currentPeriod = val;
    alert(ok ? '已更新期別設定' : '更新失敗，請確認管理員權限');
}

async function saveClassTime() {
    const val = document.getElementById('classtime-input').value.trim();
    const ok = await window._fbSetClassTime(val);
    alert(ok ? '已更新上課時間說明' : '更新失敗，請確認管理員權限');
}

async function clearThisPeriod() {
    const filter = document.getElementById('filter-period').value;
    const targetPeriod = filter === '__all__' ? null : filter;
    const msg = targetPeriod
        ? `確定要清空期別「${targetPeriod}」的所有報名資料嗎？此動作無法復原。`
        : `確定要清空「全部」報名資料嗎？此動作無法復原。`;
    if (!confirm(msg)) return;
    const res = await window._fbClearRegistrations(targetPeriod);
    alert(res.ok ? `已清空 ${res.count} 筆資料` : '清空失敗：' + res.message);
}

function exportExcel() {
    const filter = document.getElementById('filter-period').value;
    const mode = document.getElementById('sort-mode').value;
    const rows = sortRows(
        allRegistrations.filter(r => filter === '__all__' || (r.period || '(無期別)') === filter),
        mode
    ).map(r => {
        const d = formatRegTime(r);
        return {
            報名時間: d ? d.toLocaleString('zh-TW', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }) : '',
            姓名: r.name, 年級: r.grade, 班級: r.class, 座號: r.seat,
            報名意願: (r.subjects||[]).join('、'),
            期別: r.period || '',
            家長一行動電話: r.phone1 || '', 家長二行動電話: r.phone2 || '', 其他電話: r.phone3 || ''
        };
    });
    if (!rows.length) return alert('目前沒有資料可以匯出');
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '報名名單');
    XLSX.writeFile(wb, `學習扶助報名名單_${filter === '__all__' ? '全部' : filter}.xlsx`);
}
</script>
</body>
</html>
